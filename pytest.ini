[pytest]
testpaths = tests
# Put the project root on sys.path so `import app` resolves. `python -m pytest`
# gets this from the cwd, but the `pytest` console script does not.
pythonpath = .
# The suite runs against the seeded development database; it is not hermetic.
# ./scripts/db.sh reset restores a known state.
addopts = -ra
filterwarnings =
    error
markers =
    slow: exercises contention with many threads
